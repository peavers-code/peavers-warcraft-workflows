name: 'Upload to CurseForge'
description: 'Uploads a WoW addon to CurseForge'

inputs:
  api_key:
    description: 'CurseForge API key'
    required: true
  toc_file:
    description: 'Path to the TOC file'
    required: true
  zip_file:
    description: 'Path to the zip file to upload'
    required: true
  release_type:
    description: 'Release type: alpha, beta, or release'
    required: false
    default: 'release'
  changelog:
    description: 'Changelog text'
    required: false
    default: ''
  changelog_type:
    description: 'Changelog format: text or markdown'
    required: false
    default: 'markdown'

outputs:
  file_id:
    description: 'The CurseForge file ID of the uploaded file'
    value: ${{ steps.upload.outputs.file_id }}

runs:
  using: 'composite'
  steps:
    - name: Extract project info from TOC
      id: toc
      shell: bash
      run: |
        TOC_FILE="${{ inputs.toc_file }}"

        # Extract project ID
        PROJECT_ID=$(grep -oP '(?<=X-Curse-Project-ID:\s)\d+' "$TOC_FILE" || echo "")
        if [ -z "$PROJECT_ID" ]; then
          echo "::error::No X-Curse-Project-ID found in $TOC_FILE"
          exit 1
        fi
        echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
        echo "Found CurseForge project ID: $PROJECT_ID"

        # Collect interface versions from every top-level TOC beside the
        # primary one, so one multi-value TOC and per-flavour TOCs both work.
        TOC_DIR=$(dirname "$TOC_FILE")
        mapfile -t TOCS < <(
          { echo "$TOC_FILE"; find "$TOC_DIR" -maxdepth 1 -type f -name '*.toc' | sed 's|^\./||' | sort; } \
            | awk '!seen[$0]++'
        )
        echo "Reading interface versions from: ${TOCS[*]}"
        INTERFACE=$(bash "${{ github.action_path }}/collect-interfaces.sh" "${TOCS[@]}")
        if [ -z "$INTERFACE" ]; then
          echo "::error::No ## Interface values found in ${TOCS[*]}"
          exit 1
        fi
        echo "interface=$INTERFACE" >> $GITHUB_OUTPUT
        echo "Found interface version(s): $INTERFACE"

    - name: Get CurseForge game versions
      id: versions
      shell: bash
      env:
        CF_API_KEY: ${{ inputs.api_key }}
      run: |
        # Fetch available game versions from CurseForge. The endpoint
        # intermittently returns non-JSON errors (rate limiting under
        # parallel uploads), so validate and retry with backoff.
        VERSIONS_JSON=""
        for attempt in 1 2 3 4 5; do
          RESPONSE=$(curl -sS --max-time 30 -H "X-Api-Token: $CF_API_KEY" \
            "https://wow.curseforge.com/api/game/versions" || echo "")
          if echo "$RESPONSE" | jq -e 'type == "array"' >/dev/null 2>&1; then
            VERSIONS_JSON="$RESPONSE"
            break
          fi
          echo "Attempt $attempt: game/versions returned non-JSON, retrying..."
          sleep $((attempt * 10))
        done
        if [ -z "$VERSIONS_JSON" ]; then
          echo "::error::CurseForge game/versions still non-JSON after 5 attempts"
          exit 1
        fi

        # Map interface numbers to CurseForge version IDs by exact dotted name
        # (120001 -> "12.0.1", 11509 -> "1.15.9"). An unlisted patch falls
        # back to the highest listed patch of the same major.minor with a
        # warning; if nothing matches at all the step fails rather than
        # tagging the file as some other game version. Logic and tests live
        # in match-game-versions.sh and tests/.
        INTERFACE="${{ steps.toc.outputs.interface }}"
        VERSIONS_FILE="$RUNNER_TEMP/curseforge-game-versions.json"
        printf '%s' "$VERSIONS_JSON" > "$VERSIONS_FILE"

        VERSION_IDS=$(bash "${{ github.action_path }}/match-game-versions.sh" "$INTERFACE" "$VERSIONS_FILE")

        if [ -z "$VERSION_IDS" ]; then
          echo "::error::Could not determine CurseForge game version IDs"
          exit 1
        fi

        echo "version_ids=$VERSION_IDS" >> $GITHUB_OUTPUT
        echo "Using CurseForge version IDs: $VERSION_IDS"

    - name: Parse dependencies from .pkgmeta
      id: deps
      shell: bash
      run: |
        PKGMETA_DIR=$(dirname "${{ inputs.toc_file }}")
        PKGMETA="$PKGMETA_DIR/.pkgmeta"
        if [ "$PKGMETA_DIR" = "." ]; then
          PKGMETA=".pkgmeta"
        fi

        RELATIONS='{"projects":[]}'
        if [ -f "$PKGMETA" ]; then
          DEP_TYPE=""
          while IFS= read -r line; do
            if echo "$line" | grep -qE '^required-dependencies:'; then
              DEP_TYPE="requiredDependency"
              continue
            fi
            if echo "$line" | grep -qE '^optional-dependencies:'; then
              DEP_TYPE="optionalDependency"
              continue
            fi
            if [ -n "$DEP_TYPE" ]; then
              if echo "$line" | grep -qE '^\s+-\s+'; then
                SLUG=$(echo "$line" | sed -E 's/^[[:space:]]*-[[:space:]]*//' | tr -d '[:space:]')
                RELATIONS=$(echo "$RELATIONS" | jq -c --arg slug "$SLUG" --arg type "$DEP_TYPE" \
                  '.projects += [{"slug": $slug, "type": $type}]')
              else
                DEP_TYPE=""
              fi
            fi
          done < "$PKGMETA"
        fi

        PROJECT_COUNT=$(echo "$RELATIONS" | jq '.projects | length')
        echo "relations=$RELATIONS" >> $GITHUB_OUTPUT
        echo "Found $PROJECT_COUNT dependencies"

    - name: Upload to CurseForge
      id: upload
      shell: bash
      env:
        CF_API_KEY: ${{ inputs.api_key }}
      run: |
        PROJECT_ID="${{ steps.toc.outputs.project_id }}"
        VERSION_IDS="${{ steps.versions.outputs.version_ids }}"
        ZIP_FILE="${{ inputs.zip_file }}"
        RELEASE_TYPE="${{ inputs.release_type }}"
        CHANGELOG="${{ inputs.changelog }}"
        CHANGELOG_TYPE="${{ inputs.changelog_type }}"
        RELATIONS='${{ steps.deps.outputs.relations }}'

        # Build game versions array for JSON
        VERSIONS_ARRAY=$(echo "$VERSION_IDS" | tr ',' '\n' | jq -R 'tonumber' | jq -s '.')

        # Build metadata JSON
        PROJECT_COUNT=$(echo "$RELATIONS" | jq '.projects | length')
        if [ "$PROJECT_COUNT" -gt 0 ]; then
          METADATA=$(jq -n \
            --argjson gameVersions "$VERSIONS_ARRAY" \
            --arg releaseType "$RELEASE_TYPE" \
            --arg changelog "$CHANGELOG" \
            --arg changelogType "$CHANGELOG_TYPE" \
            --argjson relations "$RELATIONS" \
            '{changelog: $changelog, changelogType: $changelogType, releaseType: $releaseType, gameVersions: $gameVersions, relations: $relations}')
        else
          METADATA=$(jq -n \
            --argjson gameVersions "$VERSIONS_ARRAY" \
            --arg releaseType "$RELEASE_TYPE" \
            --arg changelog "$CHANGELOG" \
            --arg changelogType "$CHANGELOG_TYPE" \
            '{changelog: $changelog, changelogType: $changelogType, releaseType: $releaseType, gameVersions: $gameVersions}')
        fi

        echo "Uploading to CurseForge project $PROJECT_ID..."
        echo "Metadata: $METADATA"

        # The upload endpoint intermittently 500s (rate limiting / server flakiness),
        # so retry 5xx and transport errors with backoff. 4xx are real errors.
        for attempt in 1 2 3 4 5; do
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 120 \
            -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=$METADATA" \
            -F "file=@$ZIP_FILE" \
            "https://wow.curseforge.com/api/projects/$PROJECT_ID/upload-file" || echo "000")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Attempt $attempt response code: $HTTP_CODE"
          echo "Response body: $BODY"

          if [ "$HTTP_CODE" -lt 500 ] && [ "$HTTP_CODE" != "000" ]; then
            break
          fi
          [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
        done

        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          FILE_ID=$(echo "$BODY" | jq -r '.id // empty')
          echo "file_id=$FILE_ID" >> $GITHUB_OUTPUT
          echo "Successfully uploaded to CurseForge! File ID: $FILE_ID"
        else
          echo "::error::CurseForge upload failed with status $HTTP_CODE: $BODY"
          exit 1
        fi
