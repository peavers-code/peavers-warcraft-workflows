name: Release

on:
  workflow_call:
    inputs:
      toc_file:
        description: 'The TOC file to update (e.g., PeaversTalentsData.toc)'
        required: true
        type: string
      addon_name:
        description: 'The addon name for tagging (e.g., PeaversTalentsData)'
        required: true
        type: string
      git_user_name:
        description: 'Git user name for commits'
        required: false
        type: string
        default: 'github-actions[bot]'
      git_user_email:
        description: 'Git user email for commits'
        required: false
        type: string
        default: 'github-actions[bot]@users.noreply.github.com'
      use_self_hosted:
        description: 'Use self-hosted runner instead of GitHub-hosted'
        required: false
        type: boolean
        default: false
      publish_curseforge:
        description: 'Upload the packaged addon to CurseForge'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  id-token: write          # mint the GitHub App token via Vault OIDC (self-hosted)

concurrency:
  group: release-${{ inputs.addon_name }}
  cancel-in-progress: false

jobs:
  release:
    # RUNNER_LABEL is read from the CALLING repository - GitHub resolves a
    # reusable workflow's vars context against the caller - so one variable per
    # addon repo moves it off the cluster with no commit anywhere. Unset falls
    # through to use_self_hosted, which is today's behaviour.
    runs-on: ${{ vars.RUNNER_LABEL || (inputs.use_self_hosted && 'warcraft-runners' || 'ubuntu-latest') }}
    steps:
      # Mint a short-lived GitHub App token via Vault OIDC and push as the App.
      # All callers run self-hosted; the PERSONAL_ACCESS_TOKEN PAT is retired.
      - name: Mint GitHub App token (Vault OIDC)
        id: ghtoken
        uses: peavers/.github/actions/gh-app-token@main

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.ghtoken.outputs.token }}

      - name: Get current version and increment
        id: version
        run: |
          CURRENT_VERSION=$(grep -oP '(?<=## Version: ).*' ${{ inputs.toc_file }})
          echo "Current version: $CURRENT_VERSION"

          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      # toc_file stays the primary TOC (version source, CurseForge project id).
      # Any other top-level *.toc beside it - per-flavour TOCs such as
      # Addon_Vanilla.toc - is bumped, committed and packaged alongside it.
      # The list is written one path per line so later steps can mapfile it.
      - name: Find top-level TOC files
        env:
          TOC_FILE: ${{ inputs.toc_file }}
        run: |
          TOC_DIR=$(dirname "$TOC_FILE")
          {
            echo "$TOC_FILE"
            find "$TOC_DIR" -maxdepth 1 -type f -name '*.toc' | sed 's|^\./||' | sort
          } | awk '!seen[$0]++' > "$RUNNER_TEMP/toc-files.txt"
          echo "TOC files:"
          cat "$RUNNER_TEMP/toc-files.txt"

      - name: Update TOC version
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          mapfile -t TOCS < "$RUNNER_TEMP/toc-files.txt"
          for toc in "${TOCS[@]}"; do
            sed -i "s/^## Version: .*$/## Version: ${NEW_VERSION}/" "$toc"
          done

      - name: Commit version bump
        run: |
          mapfile -t TOCS < "$RUNNER_TEMP/toc-files.txt"
          git config user.name "${{ inputs.git_user_name }}"
          git config user.email "${{ inputs.git_user_email }}"
          git add -- "${TOCS[@]}"
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git pull --rebase origin master
          git push

      - name: Create and push tag
        id: tag
        run: |
          NEW_TAG="${{ inputs.addon_name }}-${{ steps.version.outputs.new_version }}"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        uses: peavers-warcraft/workflow-templates/.github/actions/generate-changelog@master
        with:
          addon_name: ${{ inputs.addon_name }}
          version: ${{ steps.version.outputs.new_version }}

      - name: Generate Changelog.lua
        env:
          ADDON_NAME: ${{ inputs.addon_name }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          CHANGELOG_JSON: ${{ steps.changelog.outputs.changelog_json }}
        run: |
          # Build Lua entries from JSON
          LUA_ENTRIES=""
          if [ -n "$CHANGELOG_JSON" ] && [ "$CHANGELOG_JSON" != "[]" ]; then
            LUA_ENTRIES=$(echo "$CHANGELOG_JSON" | jq -r '.[] | "        { type = \"" + .type + "\", text = \"" + (.text | gsub("\""; "\\\"")) + "\" },"')
          fi

          {
            echo "-- Auto-generated during release. Do not edit."
            echo "PeaversChangelogs = PeaversChangelogs or {}"
            echo "PeaversChangelogs[\"${ADDON_NAME}\"] = {"
            echo "    version = \"${NEW_VERSION}\","
            echo "    entries = {"
            if [ -n "$LUA_ENTRIES" ]; then
              echo "$LUA_ENTRIES"
            fi
            echo "    }"
            echo "}"
          } > Changelog.lua

          # Ensure Changelog.lua is in every top-level TOC file
          mapfile -t TOCS < "$RUNNER_TEMP/toc-files.txt"
          for toc in "${TOCS[@]}"; do
            if ! grep -q "^Changelog.lua" "$toc"; then
              # Do not glue the entry onto a last line with no trailing newline
              if [ -s "$toc" ] && [ -n "$(tail -c1 "$toc")" ]; then
                echo >> "$toc"
              fi
              echo "Changelog.lua" >> "$toc"
            fi
          done

      - name: Package addon
        id: package
        env:
          TOC_FILE: ${{ inputs.toc_file }}
        run: |
          RELEASE_DIR="${{ inputs.addon_name }}"
          ZIP_NAME="${{ inputs.addon_name }}-${{ steps.version.outputs.new_version }}.zip"
          mapfile -t TOCS < "$RUNNER_TEMP/toc-files.txt"

          TOC_DIR=$(dirname "$TOC_FILE")
          if [ "$TOC_DIR" = "." ]; then PKGMETA=".pkgmeta"; else PKGMETA="$TOC_DIR/.pkgmeta"; fi

          # Top-level entries that never ship: VCS/CI plumbing, editor and
          # lint config, catalog metadata. None of these can be loaded by the
          # game client. This is the floor, applied to every addon - .pkgmeta
          # can add to it below but never take away from it, so a stale or
          # incomplete ignore list cannot leak dev files into a release.
          EXCLUDE=(.git .github .gitignore .pkgmeta .claude .idea .editorconfig
                   .luacheckrc .luarc.json .wowlint.json .peavers.yml
                   catalog-info.yaml scripts local_deploy.sh local_deploy.ps1)
          # Dev-only directories (perf harness, tests). Excluded unless a TOC
          # lists a file inside one, in which case the addon loads it and it
          # must ship.
          DEV_DIRS=(perf tests tools node_modules)

          # Top-level names some TOC loads from, lowercased. Anything the game
          # loads has to ship no matter what an exclusion list says, so this
          # overrides both lists below.
          TOC_REFS=$(cat "${TOCS[@]}" | tr -d '\r' | tr '\\' '/' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^#' | grep -v '^$' \
            | cut -d/ -f1 | tr '[:upper:]' '[:lower:]' | sort -u)

          loads_from() {
            printf '%s\n' "$TOC_REFS" \
              | grep -qxF "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
          }

          FIND_ARGS=(! -name '.' ! -name '*.md' ! -name "$RELEASE_DIR")
          for name in "${EXCLUDE[@]}"; do
            FIND_ARGS+=(! -name "$name")
          done
          for name in "${DEV_DIRS[@]}"; do
            if loads_from "$name"; then
              echo "::warning::${name}/ is listed in a TOC, so it ships in the release zip"
            else
              FIND_ARGS+=(! -name "$name")
            fi
          done

          # Per-addon extras from .pkgmeta `ignore:` - artwork, specs, local
          # harnesses. The baseline above cannot know about these, and until
          # now nothing read them, so they shipped.
          if [ -f "$PKGMETA" ]; then
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              case "$entry" in
                */*)
                  echo "::warning::$PKGMETA ignores '$entry', but only top-level names are honoured here - skipping"
                  continue
                  ;;
              esac
              if loads_from "$entry"; then
                echo "::warning::$PKGMETA ignores '$entry' but a TOC loads from it, so it ships"
                continue
              fi
              FIND_ARGS+=(! -name "$entry")
            done <<< "$(awk '
              /^ignore:/       { inblock = 1; next }
              /^[^[:space:]#]/ { inblock = 0 }
              inblock && /^[[:space:]]*-[[:space:]]*[^[:space:]#]/ {
                sub(/^[[:space:]]*-[[:space:]]*/, "")
                sub(/[[:space:]]*#.*$/, "")
                sub(/[[:space:]]+$/, "")
                if (length($0)) print
              }
            ' "$PKGMETA")"
          fi

          # Create clean copy excluding non-addon files
          mkdir -p "$RELEASE_DIR"
          find . -maxdepth 1 "${FIND_ARGS[@]}" -exec cp -r {} "$RELEASE_DIR/" \;

          # Create zip and cleanup
          zip -r "$ZIP_NAME" "$RELEASE_DIR"
          rm -rf "$RELEASE_DIR"
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ steps.ghtoken.outputs.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            "${{ steps.package.outputs.zip_name }}" \
            "${{ steps.package.outputs.zip_name }}.sha256" \
            --title "${{ inputs.addon_name }} v${{ steps.version.outputs.new_version }}" \
            --notes "${{ steps.changelog.outputs.changelog }}" \
            --latest

      # Poke the addons.peavers.io data pipeline so the static updater catalog
      # (public/data/updater-catalog.json) rebuilds within minutes of this
      # release instead of waiting for its 12h schedule. Best-effort: the
      # scheduled rebuild is the fallback if the poke fails.
      #
      # The dispatch target lives in peavers-code, but the release token above
      # is scoped to the calling repo's org (peavers-warcraft) — using it here
      # 404s. Mint a second token against the App's peavers-code installation.
      - name: Mint peavers-code token for catalog poke (Vault OIDC)
        id: ghtoken-code
        continue-on-error: true
        uses: peavers/.github/actions/gh-app-token@main
        with:
          owner: peavers-code

      - name: Trigger catalog rebuild
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.ghtoken-code.outputs.token }}
        run: |
          gh api repos/peavers-code/addons.peavers.io/dispatches \
            -f event_type=addon-released \
            -F 'client_payload[addon]=${{ inputs.addon_name }}' \
            -F 'client_payload[version]=${{ steps.version.outputs.new_version }}'

      # Upload to CurseForge immediately. Runs last so a CurseForge failure
      # never blocks the GitHub release or the catalog poke above.
      # CI secrets live in Vault (single source of truth, no GitHub secret-visibility
      # footguns). Requires the in-cluster runner + id-token: write (both already present).
      #
      # Skipped for addons distributed exclusively through addons.peavers.io
      # (publish_curseforge: false). Everything above still runs — the GitHub
      # Release and the catalog poke are what the Updater actually consumes, so
      # those addons release exactly as before, just without the CurseForge leg.
      - name: Fetch CI secrets from Vault
        if: inputs.publish_curseforge
        uses: hashicorp/vault-action@v3
        with:
          # The tunnel hostname, not the cluster service, so this job is not tied
          # to running inside the cluster. Cloudflare terminates a real
          # certificate here, which is why verification is on - the cluster
          # service serves a private CA and needed it skipped.
          url: https://vault-ci.valhalla.life
          method: jwt
          path: jwt-github
          role: ci
          jwtGithubAudience: https://vault.internal
          exportToken: false
          secrets: |
            kv/data/cluster/_shared/curseforge api_key | CF_API_KEY

      - name: Upload to CurseForge
        if: inputs.publish_curseforge
        uses: peavers-code/peavers-warcraft-workflows/.github/actions/upload-curseforge@master
        with:
          api_key: ${{ env.CF_API_KEY }}
          toc_file: ${{ inputs.toc_file }}
          zip_file: ${{ steps.package.outputs.zip_name }}
          changelog: ${{ steps.changelog.outputs.changelog }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: release
    if: failure()
    steps:
      - name: Notify Discord
        uses: peavers-warcraft/workflow-templates/.github/actions/notify-discord@master
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "Release Failed"
